version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /themes
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      composer-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /themes
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
